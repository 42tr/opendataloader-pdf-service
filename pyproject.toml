[project]
name = "opendataloader-pdf-api"
version = "0.1.0"
description = "A /file_parse compatible API backed by OpenDataLoader PDF."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "opendataloader-pdf>=2.4.7",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
