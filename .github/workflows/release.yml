# 每次推送 tag 时,用 Dockerfile 构建多架构镜像并推送到 ghcr.io 和阿里云 ACR。
#
# 与 diting 不同,本服务是 Python 应用,Dockerfile 含 RUN 步骤(uv sync 安装依赖),
# 在 amd64 runner 上构建 arm64 镜像需要 QEMU 模拟,因此多了 setup-qemu-action。
#
# 需要在仓库 Settings 配置 secrets:
#   ALIYUN_REGISTRY_USERNAME / ALIYUN_REGISTRY_PASSWORD
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  docker:
    name: build & push docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 阿里云 ACR 个人版不支持 OCI provenance 工件,必须关闭
          provenance: false
          tags: |
            ghcr.io/42tr/opendataloader-pdf-service:${{ steps.meta.outputs.version }}
            ghcr.io/42tr/opendataloader-pdf-service:latest
            crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com/42tr/opendataloader-pdf-service:${{ steps.meta.outputs.version }}
            crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com/42tr/opendataloader-pdf-service:latest
