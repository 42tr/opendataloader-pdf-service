services:
  pdfservice:
    build: .
    ports:
      - "8000:8000"
    environment:
      HYBRID_URL: http://127.0.0.1:5002
      HYBRID_TIMEOUT_MS: "600000"
      HYBRID_STARTUP_TIMEOUT: "600"
      HYBRID_OCR_LANG: ch_sim
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
